<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post - Tengku</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Quill core css for formatting -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.core.css" rel="stylesheet">

  <link rel="stylesheet" href="style-desktop.css" media="screen and (min-width: 769px)">
  <link rel="stylesheet" href="style-mobile.css" media="screen and (max-width: 768px)">
  <link rel="stylesheet" href="posts.css">
</head>
<body class="posts-page">
    <nav id="posts-desktop-nav">
        <div class="logo">
        <a href="index.html">Tengku</a>
		</div>
        <div class="nav-links">
            <div class="hamburger-menu">
                <div class="hamburger-icon" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="menu-links">
                    <a href="projects.html" onclick="toggleMenu()">Projects</a>
                    <a href="posts.html" onclick="toggleMenu()">Posts</a>
                </div>
            </div>
        </div>
    </nav>
    <nav id="hamburger-nav">
        <div class="logo">
        <a href="index.html">Tengku</a>
		</div>
        <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-links">
                <a href="projects.html" onclick="toggleMenu()">Projects</a>
                <a href="posts.html" onclick="toggleMenu()">Posts</a>
            </div>
        </div>
    </nav>
  <div class="posts-container">

    <div id="single-post-container" style="max-width: 800px; margin: 0 auto; padding: 40px 0;">
        <a href="posts.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to all posts</a>
        
        <div id="post-loading" style="text-align: center; padding: 50px;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>Loading post...</p>
        </div>

        <div id="post-error" class="error-msg" style="display: none; text-align: center; padding: 50px;">
            <h2>Post Not Found</h2>
            <p>The post you are looking for does not exist or has been deleted.</p>
        </div>

        <article id="post-article" style="display: none;">
            <div class="post-header-single">
                <div class="post-meta" id="sp-meta">Date &bull; Read Time</div>
                <h1 class="post-title" id="sp-title" style="font-size: 2.5rem; margin-bottom: 20px;">Title</h1>
                <div class="post-tags" id="sp-tags" style="margin-bottom: 40px;">
                    <!-- Tags injected here -->
                </div>
            </div>
            
            <!-- Quill editor content container -->
            <div class="ql-container ql-snow" style="border: none;">
                <div class="ql-editor post-body" id="sp-content" style="padding: 0;">
                    <!-- Content injected here -->
                </div>
            </div>
        </article>
    </div>

  </div>

  <script src="script.js"></script>
  <script type="module" src="post.js"></script>
</body>
</html>
