<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tengku</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Quill.js Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  
  <!-- Common Styles -->
  <link rel="stylesheet" href="style-desktop.css" media="screen and (min-width: 769px)">
  <link rel="stylesheet" href="style-mobile.css" media="screen and (max-width: 768px)">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
  <div class="admin-container">
    
    <!-- Navigation (Simple for admin) -->
    <nav id="admin-nav">
      <div class="logo">
        <a href="index.html">Tengku Admin</a>
      </div>
      <div id="user-controls" style="display: none;">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn btn-color-1 btn-small">Logout</button>
      </div>
    </nav>

    <!-- Login Screen -->
    <div id="login-screen" class="admin-section">
      <div class="login-box">
        <h2>Admin Access Only</h2>
        <p>You must authenticate with an authorized Google account to access this dashboard.</p>
        <button id="login-btn" class="btn btn-color-1 google-sign-in" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; white-space: nowrap; padding: 12px 24px; width: auto; min-width: 200px;">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
            Sign in with Google
        </button>
        <p id="login-error" class="error-msg" style="display: none;">Unauthorized access.</p>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="admin-section" style="display: none;">
      
      <!-- List of Existing Posts -->
      <div class="dashboard-header">
        <h2>Manage Posts</h2>
        <button id="create-new-btn" class="btn btn-color-1"><i class="fas fa-plus"></i> Create New Post</button>
      </div>
      <div id="admin-posts-list" class="admin-posts-list">
        <p>Loading posts...</p>
      </div>

      <!-- Post Editor Form (Hidden by default) -->
      <div id="editor-section" class="editor-section" style="display: none;">
        <h2 id="editor-title">Create New Post</h2>
        
        <form id="post-form">
          <div class="form-group">
            <label for="post-title-input">Title</label>
            <input type="text" id="post-title-input" required placeholder="e.g. Building Resilient AI Agents">
          </div>
          
          <div class="form-group row-group">
            <div class="half-width">
              <label for="post-date-input">Date String</label>
              <input type="text" id="post-date-input" required placeholder="e.g. March 5, 2026">
            </div>
            <div class="half-width">
              <label for="post-readtime-input">Read Time & Word Count</label>
              <input type="text" id="post-readtime-input" required placeholder="e.g. 2 min read &bull; 407 words">
            </div>
          </div>

          <div class="form-group">
            <label for="post-tags-input">Tags (Comma separated)</label>
            <input type="text" id="post-tags-input" required placeholder="e.g. ai, agents, architecture, learn">
          </div>

          <div class="form-group">
            <label>Content</label>
            <div id="quill-editor"></div>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-edit-btn" class="btn btn-color-2">Cancel</button>
            <button type="submit" id="save-post-btn" class="btn btn-color-1">Save Post</button>
          </div>
        </form>
      </div>

    </div>

  </div>

  <!-- Firebase & App Logic -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
